<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ganti Password — KostNest</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  <link href="../../assets/css/global.css" rel="stylesheet"/>

  <style>
    .password-wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
      background:var(--clr-bg);
    }

    .password-card{
      width:100%;
      max-width:500px;
      background:var(--clr-surface);
      border-radius:var(--radius);
      border:1.5px solid var(--clr-border);
      box-shadow:var(--shadow-lg);
      padding:32px;
    }

    .password-title{
      font-family:var(--font-display);
      font-size:28px;
      margin-bottom:6px;
      color:var(--clr-text);
    }

    .password-subtitle{
      font-size:14px;
      color:var(--clr-muted);
      margin-bottom:28px;
    }

    .form-group-custom{
      margin-bottom:18px;
    }

    .form-label-custom{
      display:block;
      font-size:12px;
      font-weight:700;
      letter-spacing:.06em;
      text-transform:uppercase;
      color:var(--clr-muted);
      margin-bottom:8px;
    }

    .form-input-custom{
      width:100%;
      padding:12px 14px;
      border:1.5px solid var(--clr-border);
      border-radius:10px;
      background:var(--clr-bg);
      outline:none;
    }

    .form-input-custom:focus{
      border-color:var(--clr-primary);
    }

    .btn-full{
      width:100%;
      justify-content:center;
    }
  </style>
</head>

<body>

<div class="password-wrap">

  <div class="password-card">

    <div class="password-title">
      Ganti Password
    </div>

    <div class="password-subtitle">
      Buat password baru untuk akun KostNest Anda.
    </div>

    <div class="form-group-custom">
      <label class="form-label-custom">
        Password Baru
      </label>

      <input type="password"
             class="form-input-custom"
             placeholder="Masukkan password baru">
    </div>

    <div class="form-group-custom">
      <label class="form-label-custom">
        Konfirmasi Password
      </label>

      <input type="password"
             class="form-input-custom"
             placeholder="Ulangi password baru">
    </div>

    <div class="d-flex gap-2 mt-4">

      <a href="../user/pengaturan.html"
         class="btn-outline-custom flex-fill">
        Kembali
      </a>

      <a href="../user/pengaturan.html"
         class="btn-primary-custom flex-fill">

        <i class="fa-solid fa-save"></i>
        Simpan Password

      </a>

    </div>

  </div>

</div>

</body>
</html>
