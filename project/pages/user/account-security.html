<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Account & Security — KostNest</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  <link href="../../assets/css/global.css" rel="stylesheet"/>
</head>

<body>

<script src="../../assets/js/layout.js"></script>
<script>
  buildLayout({
    pageId:'pengaturan',
    pageTitle:'Account & Security'
  });
</script>

<main class="main-wrap">
  <div class="content-area">

    <div class="page-header">
      <div class="page-header-left">
        <div class="page-title">Account & Security</div>
        <div class="page-subtitle">
          Pengaturan keamanan akun
        </div>
      </div>
    </div>

    <div class="card-custom">
      <div class="card-body-custom">
            <!-- TWO FACTOR -->
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
          <div>
            <div class="fw-600">Two-Factor Authentication</div>
            <div class="text-muted-c" style="font-size:13px">
              Tambahan keamanan login
            </div>
          </div>

          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox">
          </div>
        </div>

        <!-- EMAIL -->
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
          <div>
            <div class="fw-600">Email Notifications</div>
            <div class="text-muted-c" style="font-size:13px">
              Notifikasi keamanan akun
            </div>
          </div>

          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" checked>
          </div>
        </div>

        <!-- SESSION -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <div class="fw-600">Session Login</div>
            <div class="text-muted-c" style="font-size:13px">
              Kelola perangkat aktif
            </div>
          </div>

          <button class="btn-outline-custom">
            Kelola Session
          </button>
        </div>

        <!-- BUTTON -->
        <div class="mt-4 d-flex gap-2">

          <button class="btn-primary-custom">
            <i class="fa-solid fa-save"></i>
            Simpan Pengaturan
          </button>

          <a href="pengaturan.html" class="btn-outline-custom">
            <i class="fa-solid fa-arrow-left"></i>
            Kembali ke Pengaturan
          </a>

        </div>

      </div>
    </div>

  </div>
</main>

</body>
</html>
