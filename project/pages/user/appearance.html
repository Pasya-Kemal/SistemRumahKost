<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Appearance — KostNest</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  <link href="../../assets/css/global.css" rel="stylesheet"/>
</head>

<body>

<script src="../../assets/js/layout.js"></script>
<script>
  buildLayout({
    pageId:'pengaturan',
    pageTitle:'Appearance'
  });
</script>

<main class="main-wrap">
  <div class="content-area">

    <div class="page-header">
      <div class="page-header-left">
        <div class="page-title">Appearance</div>
        <div class="page-subtitle">
          Atur tampilan aplikasi KostNest
        </div>
      </div>
    </div>

    <div class="card-custom">
      <div class="card-body-custom">

        <!-- TEMA -->
        <div class="mb-4">
          <label class="form-label-custom">Tema</label>

          <div class="d-flex gap-2 flex-wrap">
            <button class="filter-chip active">
              Light Mode
            </button>

            <button class="filter-chip">
              Dark Mode
            </button>

            <button class="filter-chip">
              Auto
            </button>
          </div>
        </div>

        <!-- SIDEBAR -->
        <div class="mb-4">
          <label class="form-label-custom">Sidebar</label>

          <select class="form-input-custom">
            <option>Expanded</option>
            <option>Collapsed</option>
          </select>
        </div>

        <!-- COMPACT -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <div class="fw-600">Compact Mode</div>

            <div class="text-muted-c"
                style="font-size:13px">
              Tampilan lebih ringkas
            </div>
          </div>

          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox">
          </div>
        </div>

        <!-- BUTTON -->
        <div class="mt-4 d-flex gap-2">

          <button class="btn-primary-custom">
            <i class="fa-solid fa-save"></i>
            Simpan Tampilan
          </button>

          <a href="pengaturan.html" class="btn-outline-custom">
            <i class="fa-solid fa-arrow-left"></i>
            Kembali ke Pengaturan
          </a>

        </div>

  </div>
</div>
    </div>

  </div>
</main>

<script>
  initFilterChips();
</script>

</body>
</html>
