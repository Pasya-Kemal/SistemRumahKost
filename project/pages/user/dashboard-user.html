<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KostNest — Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  <link href="../../assets/css/global.css" rel="stylesheet"/>
  <style>
    /* ── KAMAR CARD (user version — richer) ── */
    .room-card {
      background: var(--clr-surface);
      border: 1.5px solid var(--clr-border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: all .3s cubic-bezier(.34,1.56,.64,1);
      cursor: pointer;
    }
    .room-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 48px rgba(44,74,62,.16);
      border-color: var(--clr-primary);
    }
    .room-img-wrap {
      position: relative;
      height: 180px;
      overflow: hidden;
    }
    .room-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform .4s ease;
    }
    .room-card:hover .room-img-wrap img {
      transform: scale(1.06);
    }
    .room-img-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 50%, rgba(26,40,32,.55) 100%);
      pointer-events: none;
    }
    .room-status-pill {
      position: absolute; top: 12px; left: 12px;
    }
    .room-price-overlay {
      position: absolute; bottom: 12px; right: 12px;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(6px);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 13px; font-weight: 700;
      color: var(--clr-primary);
    }
    .room-info {
      padding: 16px 18px 18px;
    }
    .room-number {
      font-family: var(--font-display); font-size: 20px;
      color: var(--clr-text); line-height: 1.2; margin-bottom: 2px;
    }
    .room-type {
      font-size: 12px; color: var(--clr-muted); margin-bottom: 12px;
    }
    .room-features {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px;
    }
    .room-feat-tag {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--clr-bg); border: 1px solid var(--clr-border);
      border-radius: 6px; padding: 4px 9px;
      font-size: 11px; font-weight: 500; color: var(--clr-muted);
    }
    .room-feat-tag i { font-size: 10px; color: var(--clr-primary); }
    .btn-detail {
      width: 100%;
      padding: 10px;
      background: var(--clr-primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px; font-weight: 600;
      font-family: var(--font-body);
      cursor: pointer;
      transition: all .2s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-detail:hover { background: var(--clr-primary-light); }
    .btn-detail.kosong {
      background: var(--clr-accent);
      color: var(--clr-sidebar);
    }
    .btn-detail.kosong:hover { background: #c49640; }
    .btn-detail:disabled {
      background: var(--clr-border); color: var(--clr-muted); cursor: not-allowed;
    }

    /* ── MODAL DETAIL ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(10,20,15,.55);
      backdrop-filter: blur(4px);
      z-index: 2000;
      align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: var(--clr-surface);
      border-radius: var(--radius);
      width: 100%; max-width: 680px;
      box-shadow: 0 24px 80px rgba(44,74,62,.25);
      animation: fadeUp .3s cubic-bezier(.34,1.2,.64,1);
      overflow: hidden;
      max-height: 90vh;
      display: flex; flex-direction: column;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(24px) scale(.97) }
      to   { opacity:1; transform:translateY(0) scale(1) }
    }
    .modal-img-wrap {
      position: relative; height: 240px; flex-shrink: 0;
    }
    .modal-img-wrap img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .modal-img-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 40%, rgba(26,40,32,.7) 100%);
    }
    .modal-img-header {
      position: absolute; bottom: 20px; left: 24px; right: 24px;
      display: flex; align-items: flex-end; justify-content: space-between;
    }
    .modal-room-name {
      font-family: var(--font-display); font-size: 30px; color: #fff; line-height: 1.1;
    }
    .modal-room-price {
      background: var(--clr-accent);
      color: var(--clr-sidebar);
      border-radius: 10px; padding: 6px 14px;
      font-size: 15px; font-weight: 700;
      white-space: nowrap;
    }
    .modal-close {
      position: absolute; top: 16px; right: 16px;
      width: 36px; height: 36px;
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(6px);
      border: none; border-radius: 50%;
      font-size: 16px; color: var(--clr-text);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all .2s; z-index: 10;
    }
    .modal-close:hover { background: #fff; transform: scale(1.1); }
    .modal-body-scroll {
      overflow-y: auto; padding: 24px;
    }
    .modal-section-title {
      font-size: 11px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--clr-muted); margin-bottom: 12px;
    }
    .detail-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;
    }
    .detail-item {
      background: var(--clr-bg); border-radius: 10px; padding: 12px 14px;
      display: flex; align-items: center; gap: 12px;
    }
    .detail-item-icon {
      width: 36px; height: 36px; border-radius: 8px;
      background: rgba(44,74,62,.1);
      display: flex; align-items: center; justify-content: center;
      color: var(--clr-primary); font-size: 14px; flex-shrink: 0;
    }
    .detail-item-label { font-size: 11px; color: var(--clr-muted); margin-bottom: 2px; }
    .detail-item-value { font-size: 14px; font-weight: 600; color: var(--clr-text); }
    .fasilitas-wrap {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px;
    }
    .fasilitas-tag {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(44,74,62,.08);
      border: 1.5px solid rgba(44,74,62,.15);
      border-radius: 8px; padding: 7px 12px;
      font-size: 13px; font-weight: 500; color: var(--clr-primary);
    }
    .fasilitas-tag i { font-size: 12px; }
    .modal-desc {
      font-size: 14px; color: var(--clr-muted); line-height: 1.75;
      margin-bottom: 20px;
    }
    .btn-hubungi {
      width: 100%; padding: 13px;
      background: var(--clr-primary); color: #fff;
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700;
      font-family: var(--font-body); cursor: pointer;
      transition: all .2s; display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 6px 20px rgba(44,74,62,.3);
    }
    .btn-hubungi:hover { background: var(--clr-primary-light); transform: translateY(-1px); }
    .btn-hubungi.disabled-btn {
      background: var(--clr-border); color: var(--clr-muted);
      cursor: not-allowed; box-shadow: none;
    }
    .btn-hubungi.disabled-btn:hover { transform: none; }

    /* thumbnail strip in modal */
    .thumb-strip { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; }
    .thumb-strip img {
      width: 80px; height: 56px; object-fit: cover;
      border-radius: 8px; border: 2px solid transparent;
      cursor: pointer; transition: border-color .2s; flex-shrink: 0;
    }
    .thumb-strip img.active { border-color: var(--clr-primary); }
    .thumb-strip img:hover { border-color: var(--clr-primary-light); }

    /* stat summary bar */
    .stat-summary {
      display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap;
    }
    .stat-pill {
      display: flex; align-items: center; gap: 8px;
      background: var(--clr-surface); border: 1.5px solid var(--clr-border);
      border-radius: 10px; padding: 10px 16px;
      font-size: 13px; font-weight: 500;
    }
    .stat-pill i { color: var(--clr-primary); }
    .stat-pill strong { font-weight: 700; }
  </style>
</head>
<body>
<script src="../../assets/js/layout.js"></script>
<script>buildLayout({ pageId: 'dashboard', pageTitle: 'Dashboard' });</script>

<main class="main-wrap">
  <div class="content-area">

    <!-- PAGE HEADER -->
    <div class="page-header">
      <div class="page-header-left">
        <div class="page-title">Selamat Datang 👋</div>
        <div class="page-subtitle">Jelajahi kamar tersedia di KostNest</div>
      </div>
    </div>

    <!-- STAT SUMMARY -->
    <div class="stat-summary">
      <div class="stat-pill"><i class="fa-solid fa-door-open"></i> Total <strong>24 Kamar</strong></div>
      <div class="stat-pill"><i class="fa-solid fa-circle-check" style="color:var(--clr-success)"></i> Tersedia <strong style="color:var(--clr-success)">5 Kamar</strong></div>
      <div class="stat-pill"><i class="fa-solid fa-user-check" style="color:var(--clr-muted)"></i> Terisi <strong>19 Kamar</strong></div>
      <div class="stat-pill"><i class="fa-solid fa-star" style="color:var(--clr-accent)"></i> Rating <strong>4.8 / 5</strong></div>
    </div>

    <!-- FILTER -->
    <div class="filter-bar">
      <button class="filter-chip active" onclick="filterKamar('semua',this)">Semua (24)</button>
      <button class="filter-chip" onclick="filterKamar('terisi',this)">Terisi (19)</button>
      <button class="filter-chip" onclick="filterKamar('kosong',this)">Kosong (5)</button>
      <select class="filter-select" id="filterTipe" onchange="applyFilters()">
        <option value="">Semua Tipe</option>
        <option value="Standar">Standar</option>
        <option value="Deluxe">Deluxe</option>
        <option value="Premium">Premium</option>
      </select>
      <select class="filter-select" id="filterLantai" onchange="applyFilters()">
        <option value="">Semua Lantai</option>
        <option value="1">Lantai 1</option>
        <option value="2">Lantai 2</option>
      </select>
    </div>

    <!-- KAMAR GRID -->
    <div class="row g-3" id="kamarGrid"></div>

  </div>
</main>

<!-- MODAL DETAIL -->
<div class="modal-overlay" id="detailModal" onclick="handleOverlayClick(event)">
  <div class="modal-box">
    <!-- IMAGE HEADER -->
    <div class="modal-img-wrap" id="modalImgWrap">
      <img id="modalMainImg" src="" alt="Foto Kamar"/>
      <div class="modal-img-overlay"></div>
      <div class="modal-img-header">
        <div>
          <div id="modalName" class="modal-room-name"></div>
          <div id="modalType" style="font-size:13px;color:rgba(255,255,255,.75);margin-top:2px"></div>
        </div>
        <div id="modalPrice" class="modal-room-price"></div>
      </div>
      <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="modal-body-scroll">
      <!-- THUMBNAIL STRIP -->
      <div class="thumb-strip" id="thumbStrip"></div>

      <!-- DETAIL GRID -->
      <div class="modal-section-title">Informasi Kamar</div>
      <div class="detail-grid">
        <div class="detail-item">
          <div class="detail-item-icon"><i class="fa-solid fa-layer-group"></i></div>
          <div>
            <div class="detail-item-label">Lantai</div>
            <div class="detail-item-value" id="modalLantai">—</div>
          </div>
        </div>
        <div class="detail-item">
          <div class="detail-item-icon"><i class="fa-solid fa-ruler-combined"></i></div>
          <div>
            <div class="detail-item-label">Luas</div>
            <div class="detail-item-value" id="modalLuas">—</div>
          </div>
        </div>
        <div class="detail-item">
          <div class="detail-item-icon" style="background:rgba(39,174,96,.1);color:var(--clr-success)"><i class="fa-solid fa-circle-check"></i></div>
          <div>
            <div class="detail-item-label">Status</div>
            <div class="detail-item-value" id="modalStatus">—</div>
          </div>
        </div>
        <div class="detail-item">
          <div class="detail-item-icon" style="background:rgba(212,168,83,.15);color:var(--clr-accent)"><i class="fa-solid fa-tag"></i></div>
          <div>
            <div class="detail-item-label">Tipe</div>
            <div class="detail-item-value" id="modalTipe">—</div>
          </div>
        </div>
      </div>

      <!-- FASILITAS -->
      <div class="modal-section-title">Fasilitas</div>
      <div class="fasilitas-wrap" id="modalFasilitas"></div>

      <!-- DESKRIPSI -->
      <div class="modal-section-title">Deskripsi</div>
      <div class="modal-desc" id="modalDesc"></div>

      <!-- CTA -->
      <button class="btn-hubungi" id="modalCTA" onclick="hubungiAdmin()">
        <i class="fa-solid fa-paper-plane"></i> Hubungi Admin
      </button>
    </div>
  </div>
</div>

// ── ICON MAP ─────────────────────────────────────────────────────────
const FEAT_ICON = {
  'WiFi':        'fa-wifi',
  'AC':          'fa-snowflake',
  'TV':          'fa-tv',
  'KM Dalam':    'fa-bath',
  'Water Heater':'fa-fire',
  'Furnished':   'fa-couch',
  'Balkon':      'fa-sun',
};

function featIcon(f) {
  return FEAT_ICON[f] || 'fa-check';
}

// ── STATUS BADGE ──────────────────────────────────────────────────────
function statusBadge(status) {
  if (status === 'terisi')      return '<span class="badge-custom badge-success">Terisi</span>';
  if (status === 'kosong')      return '<span class="badge-custom badge-info">Tersedia</span>';
  if (status === 'maintenance') return '<span class="badge-custom badge-warning">Maintenance</span>';
  return '';
}

// ── RENDER CARDS ──────────────────────────────────────────────────────
let activeFilter = 'semua';

function renderGrid(data) {
  const grid = document.getElementById('kamarGrid');
  if (!data.length) {
    grid.innerHTML = `<div class="col-12 text-center py-5" style="color:var(--clr-muted)">
      <i class="fa-solid fa-door-open" style="font-size:40px;opacity:.3;margin-bottom:12px;display:block"></i>
      Tidak ada kamar ditemukan.
    </div>`;
    return;
  }
  grid.innerHTML = data.map(k => {
    const isKosong = k.status === 'kosong';
    const isMaint  = k.status === 'maintenance';
    const btnClass = isKosong ? 'btn-detail kosong' : isMaint ? 'btn-detail' : 'btn-detail';
    const btnIcon  = isKosong ? 'fa-paper-plane' : 'fa-eye';
    const btnLabel = isKosong ? 'Sewa Sekarang' : 'Lihat Detail';
    const btnDisabled = isMaint ? 'disabled' : '';
    const feats = k.fasilitas.slice(0,3).map(f =>
      `<div class="room-feat-tag"><i class="fa-solid ${featIcon(f)}"></i> ${f}</div>`
    ).join('') + (k.fasilitas.length > 3 ? `<div class="room-feat-tag">+${k.fasilitas.length - 3}</div>` : '');

    return `
    <div class="col-sm-6 col-lg-4 col-xl-3 kamar-item" data-status="${k.status}" data-tipe="${k.tipe}" data-lantai="${k.lantai}">
      <div class="room-card" onclick="openDetail(${k.id})">
        <div class="room-img-wrap">
          <img src="${k.imgs[0]}" alt="${k.nomor}" loading="lazy" onerror="this.style.display='none'"/>
          <div class="room-img-overlay"></div>
          <div class="room-status-pill">${statusBadge(k.status)}</div>
          <div class="room-price-overlay">${k.harga}<span style="font-size:10px;font-weight:400">/bln</span></div>
        </div>
        <div class="room-info">
          <div class="room-number">${k.nomor}</div>
          <div class="room-type">Tipe ${k.tipe} · Lantai ${k.lantai} · ${k.luas}</div>
          <div class="room-features">${feats}</div>
          <button class="${btnClass}" ${btnDisabled} onclick="event.stopPropagation();openDetail(${k.id})">
            <i class="fa-solid ${btnIcon}"></i> ${btnLabel}
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── FILTER LOGIC ──────────────────────────────────────────────────────
function filterKamar(status, btn) {
  activeFilter = status;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  if (btn) btn.classList.add('active');
  applyFilters();
}

function applyFilters() {
  const tipe   = document.getElementById('filterTipe').value;
  const lantai = document.getElementById('filterLantai').value;
  let filtered = KAMAR_DATA;
  if (activeFilter !== 'semua') filtered = filtered.filter(k => k.status === activeFilter);
  if (tipe)   filtered = filtered.filter(k => k.tipe === tipe);
  if (lantai) filtered = filtered.filter(k => k.lantai === parseInt(lantai));
  renderGrid(filtered);
}

// ── MODAL DETAIL ──────────────────────────────────────────────────────
let currentKamar = null;

function openDetail(id) {
  const k = KAMAR_DATA.find(x => x.id === id);
  if (!k) return;
  currentKamar = k;

  // Main image
  document.getElementById('modalMainImg').src = k.imgs[0];
  document.getElementById('modalName').textContent = k.nomor;
  document.getElementById('modalType').textContent = `Tipe ${k.tipe} · Lantai ${k.lantai}`;
  document.getElementById('modalPrice').textContent = k.harga + '/bln';
  document.getElementById('modalLantai').textContent = 'Lantai ' + k.lantai;
  document.getElementById('modalLuas').textContent = k.luas;
  document.getElementById('modalTipe').textContent = k.tipe;

  const statusMap = { terisi: '🔴 Terisi', kosong: '🟢 Tersedia', maintenance: '🟡 Maintenance' };
  document.getElementById('modalStatus').textContent = statusMap[k.status] || k.status;

  // Thumbnails
  document.getElementById('thumbStrip').innerHTML = k.imgs.map((img, i) =>
    `<img src="${img}" class="${i === 0 ? 'active' : ''}" onclick="switchImg(this,'${img}')" loading="lazy" alt="foto ${i+1}"/>`
  ).join('');

  // Fasilitas
  document.getElementById('modalFasilitas').innerHTML = k.fasilitas.map(f =>
    `<div class="fasilitas-tag"><i class="fa-solid ${featIcon(f)}"></i> ${f}</div>`
  ).join('');

  // Desc
  document.getElementById('modalDesc').textContent = k.desc;

  // CTA button
  const cta = document.getElementById('modalCTA');
  if (k.status === 'maintenance') {
    cta.className = 'btn-hubungi disabled-btn';
    cta.innerHTML = '<i class="fa-solid fa-wrench"></i> Sedang Maintenance';
  } else if (k.status === 'terisi') {
    cta.className = 'btn-hubungi';
    cta.style.background = 'var(--clr-muted)';
    cta.innerHTML = '<i class="fa-solid fa-user-xmark"></i> Kamar Sudah Terisi';
  } else {
    cta.className = 'btn-hubungi';
    cta.style.background = '';
    cta.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Hubungi Admin untuk Sewa';
  }

  document.getElementById('detailModal').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function switchImg(el, src) {
  document.getElementById('modalMainImg').src = src;
  document.querySelectorAll('#thumbStrip img').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
}

function closeModal() {
  document.getElementById('detailModal').classList.remove('show');
  document.body.style.overflow = '';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('detailModal')) closeModal();
}

function hubungiAdmin() {
  if (!currentKamar || currentKamar.status !== 'kosong') return;
  alert(`Permintaan sewa ${currentKamar.nomor} telah dikirim ke admin. Admin akan menghubungi Anda segera.`);
  closeModal();
}

// ── INIT ──────────────────────────────────────────────────────────────
renderGrid(KAMAR_DATA);
</script>
</body>
</html>
